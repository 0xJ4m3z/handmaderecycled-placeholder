<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handmade Recycled — Back Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft: #FBF9F4;
    --kraft-deep: #F3EFE5;
    --ink: #2B2621;
    --moss: #5C6B4A;
    --rust: #A85832;
    --line: rgba(43,38,33,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background: var(--kraft);
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(92,107,74,0.045), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(168,88,50,0.045), transparent 55%);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 6vh 6vw;
  }
  .card{
    max-width: 640px;
    width:100%;
    text-align:center;
  }
  .logo{
    width: min(420px, 78vw);
    height:auto;
    display:block;
    margin: 0 auto 3.2rem;
  }
  .rule{
    width: 64px;
    height: 3px;
    background: var(--rust);
    margin: 0 auto 2.2rem;
    border-radius: 2px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(1.9rem, 4.6vw, 2.9rem);
    line-height: 1.18;
    letter-spacing: -0.01em;
    margin-bottom: 1.3rem;
  }
  h1 .season{
    font-style: normal;
    color: var(--moss);
  }
  p.sub{
    font-size: clamp(1rem, 1.5vw, 1.125rem);
    line-height: 1.6;
    color: rgba(43,38,33,0.72);
    max-width: 46ch;
    margin: 0 auto 2.6rem;
  }
  .note{
    display:inline-block;
    font-size: 0.9rem;
    color: rgba(43,38,33,0.6);
    border-top: 1px solid var(--line);
    padding-top: 1.4rem;
    margin-top: 0.4rem;
  }
  .note a{
    color: var(--rust);
    text-decoration: none;
    border-bottom: 1px solid rgba(168,88,50,0.35);
  }
  .note a:hover{
    border-bottom-color: var(--rust);
  }
  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise 0.7s ease-out; }
    @keyframes rise{
      from{ opacity:0; transform: translateY(10px); }
      to{ opacity:1; transform: translateY(0); }
    }
  }
</style>
</head>
